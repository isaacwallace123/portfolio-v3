name: publish

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

# Build the services and sites, push them to GHCR, then pin the immutable commit tag in the
# Kubernetes manifests. ArgoCD watches those manifest changes and performs the production rollout.
# A version tag also produces an immutable :vX.Y.Z image.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          # The .NET services are self-contained builds → each its own dir is the context.
          - name: portfolio-auth-service
            context: apps/auth
            dockerfile: apps/auth/Dockerfile
            build_args: ""
          - name: portfolio-api
            context: apps/api
            dockerfile: apps/api/Dockerfile
            build_args: ""
          # checkout-demo — the real three-tier workload the HomeOps arena provisions.
          - name: portfolio-checkout-demo
            context: apps/checkout-demo
            dockerfile: apps/checkout-demo/Dockerfile
            build_args: ""
          # The Next apps are a monorepo workspace: the build context is the REPO ROOT so the
          # shared @iw/* packages are in scope; the Dockerfile lives under the app dir.
          - name: portfolio-web
            context: .
            dockerfile: apps/web/Dockerfile
            build_args: |
              NEXT_PUBLIC_API_URL=https://api.isaacwallace.dev
              NEXT_PUBLIC_AUTH_API_URL=https://auth.isaacwallace.dev
              NEXT_PUBLIC_ADMIN_URL=https://admin.isaacwallace.dev
              NEXT_PUBLIC_HOME_URL=https://isaacwallace.dev
              NEXT_PUBLIC_CYBERLAB_URL=https://cyberlab.isaacwallace.dev
              NEXT_PUBLIC_HOMELAB_URL=https://homelab.isaacwallace.dev
              NEXT_PUBLIC_AILAB_URL=https://ailab.isaacwallace.dev
          - name: portfolio-admin
            context: .
            dockerfile: apps/admin/Dockerfile
            build_args: |
              NEXT_PUBLIC_API_URL=https://api.isaacwallace.dev
              NEXT_PUBLIC_AUTH_API_URL=https://auth.isaacwallace.dev
              NEXT_PUBLIC_ADMIN_URL=https://admin.isaacwallace.dev
              NEXT_PUBLIC_HOME_URL=https://isaacwallace.dev
              NEXT_PUBLIC_CYBERLAB_URL=https://cyberlab.isaacwallace.dev
              NEXT_PUBLIC_HOMELAB_URL=https://homelab.isaacwallace.dev
              NEXT_PUBLIC_AILAB_URL=https://ailab.isaacwallace.dev
          # cyberlab.isaacwallace.dev — moved into this monorepo (was the cyberlab repo).
          - name: cyberlab-web
            context: .
            dockerfile: apps/cyberlab/Dockerfile
            build_args: |
              NEXT_PUBLIC_API_URL=https://api.isaacwallace.dev
              NEXT_PUBLIC_AUTH_API_URL=https://auth.isaacwallace.dev
              NEXT_PUBLIC_ADMIN_URL=https://admin.isaacwallace.dev
              NEXT_PUBLIC_HOME_URL=https://isaacwallace.dev
              NEXT_PUBLIC_CYBERLAB_URL=https://cyberlab.isaacwallace.dev
              NEXT_PUBLIC_HOMELAB_URL=https://homelab.isaacwallace.dev
              NEXT_PUBLIC_AILAB_URL=https://ailab.isaacwallace.dev
          - name: portfolio-homelab
            context: .
            dockerfile: apps/homelab/Dockerfile
            build_args: |
              NEXT_PUBLIC_API_URL=https://api.isaacwallace.dev
              NEXT_PUBLIC_AUTH_API_URL=https://auth.isaacwallace.dev
              NEXT_PUBLIC_ADMIN_URL=https://admin.isaacwallace.dev
              NEXT_PUBLIC_HOME_URL=https://isaacwallace.dev
              NEXT_PUBLIC_CYBERLAB_URL=https://cyberlab.isaacwallace.dev
              NEXT_PUBLIC_HOMELAB_URL=https://homelab.isaacwallace.dev
              NEXT_PUBLIC_AILAB_URL=https://ailab.isaacwallace.dev
          - name: portfolio-ailab
            context: .
            dockerfile: apps/ailab/Dockerfile
            build_args: |
              NEXT_PUBLIC_API_URL=https://api.isaacwallace.dev
              NEXT_PUBLIC_AUTH_API_URL=https://auth.isaacwallace.dev
              NEXT_PUBLIC_ADMIN_URL=https://admin.isaacwallace.dev
              NEXT_PUBLIC_HOME_URL=https://isaacwallace.dev
              NEXT_PUBLIC_CYBERLAB_URL=https://cyberlab.isaacwallace.dev
              NEXT_PUBLIC_HOMELAB_URL=https://homelab.isaacwallace.dev
              NEXT_PUBLIC_AILAB_URL=https://ailab.isaacwallace.dev
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=semver,pattern=v{{version}}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pin-production-images:
    if: github.ref == 'refs/heads/main'
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Pin published image tags for ArgoCD
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"

          declare -A images=(
            ["deploy/k8s/admin.yaml"]="portfolio-admin"
            ["deploy/k8s/ailab.yaml"]="portfolio-ailab"
            ["deploy/k8s/api.yaml"]="portfolio-api"
            ["deploy/k8s/auth-service.yaml"]="portfolio-auth-service"
            ["deploy/k8s/cyberlab.yaml"]="cyberlab-web"
            ["deploy/k8s/homelab.yaml"]="portfolio-homelab"
            ["deploy/k8s/web.yaml"]="portfolio-web"
          )

          for manifest in "${!images[@]}"; do
            image="${images[$manifest]}"
            sed -Ei \
              "s#(image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/${image}:)[^[:space:]]+#\\1${short_sha}#" \
              "$manifest"
          done

          if git diff --quiet -- deploy/k8s; then
            echo "Production manifests already reference ${short_sha}."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/k8s
          git commit -m "deploy images ${short_sha} [skip ci]"
          git push origin HEAD:main
